<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фото-баннер</title>
    <style>
        /* Обнуляем базовые отступы */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Контейнер баннера */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 80vh; /* Баннер займет 80% высоты экрана */
            min-height: 400px;
            /* Замените URL ниже на ссылку на ваше фото */
            background-image: url(https://sun9-74.userapi.com/s/v1/ig2/_tIcs9-yFFHckizJdpoI4FN98c3FBn4psUskFXEz9V6yZDhDrzJO41Tcu8tWd0hLX9WzQZM82g5YtUQmqfVh7sQu.jpg?quality=95&as=32x21,48x32,72x48,108x72,160x107,240x160,360x240,480x320,540x360,640x427,720x481,1080x721,1179x787&from=bu&u=QriLcgzW1rtV0_umSbGWwj_1LoOA9tbCW9E-ZkduPE4&cs=1179x0);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Темный фильтр поверх фото, чтобы текст лучше читался */
        .hero-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* 40% затемнения */
            z-index: 1;
        }

        /* Контент баннера */
        .banner-content {
            position: relative;
            z-index: 2; /* Поднимаем текст над темным фильтром */
            text-align: center;
            color: #ffffff;
            padding: 0 20px;
            max-width: 800px;
        }

    </style>
</head>
